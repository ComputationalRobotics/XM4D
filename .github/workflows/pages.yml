# Publishes the site on every push to main (Settings > Pages > Build and deployment > Source: "GitHub Actions"). The deploy
# step is capped at 10 minutes, as in GitHub's built-in "pages build and deployment" (deploy-pages ignores larger timeouts),
# and the ~0.9 GB site has run past that there; if it does here, the site has to get smaller.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
